name: build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mikekan13/growth-worker-comfyui
  UPSTREAM_VERSION: "5.11.0"
  COMFYUI_VERSION: "0.39.0"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (base target)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: base
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            COMFYUI_VERSION=${{ env.COMFYUI_VERSION }}
            CUDA_VERSION_FOR_COMFY=12.8
          tags: |
            ${{ env.IMAGE }}:${{ env.UPSTREAM_VERSION }}-comfy${{ env.COMFYUI_VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=runpod-workers/worker-comfyui 5.11.0 base with ComfyUI 0.39.0 (GROWTH)
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Report digest
        run: echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
